name: screentime
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  get_it: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5 # Optional, but good for state comparison
  hive_flutter: ^1.1.0
  hive: ^2.2.3 
  app_usage: ^4.0.1
  flutter_local_notifications: ^19.5.0
  workmanager: ^0.9.0+3
  external_app_launcher: ^4.0.3
  flutter_dotenv: ^5.1.0
  flutter_launcher_icons: ^0.13.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  assets:
    - assets/icons/
    - assets/images/
    - assets/.env
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

